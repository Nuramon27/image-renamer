[package]
name = "griphook"
version = "0.1.0"
edition = "2024"
description = """
Griphook is a little tool to batch-rename a set of images.
It lets you view images in a folder, select some of them for renaming,
and transform their name by matching a regular expression.
"""
license = "MIT"
publish = false


[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
iced = { version = "0.14.0", features = ["image"] }
rsraw = { version = "0.1.1", optional = true }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "bmp", "png", "tiff", "webp"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode"] }

[features]
default = []
rsraw = ["dep:rsraw"]
perf = ["regex/perf"]